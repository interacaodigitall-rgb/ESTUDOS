    <stop offset="0%" stop-color="#DCFCE7"/>
    <stop offset="100%" stop-color="#F0FDF4"/>
  </radialGradient>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Golden Star -->
  <polygon points="340,110 354,142 388,145 362,168 370,202 340,184 310,202 318,168 292,145 326,142" fill="#FBBF24" stroke="#F59E0B" stroke-width="4" stroke-linejoin="round"/>

  <!-- Green Plant / Sprout -->
  <!-- Left big leaf -->
  <path d="M 256 360 C 230 260 170 190 135 150 C 130 215 170 275 256 360 Z" fill="#4ADE80" stroke="#15803D" stroke-width="8" stroke-linejoin="round"/>
  <!-- Right small leaf -->
  <path d="M 256 320 C 275 270 320 240 345 230 C 345 265 315 295 256 320 Z" fill="#4ADE80" stroke="#15803D" stroke-width="8" stroke-linejoin="round"/>
  <!-- Central stem -->
  <path d="M 256 395 C 255 330 250 250 210 170" stroke="#15803D" stroke-width="16" stroke-linecap="round" fill="none"/>

  <!-- Open Book -->
  <!-- Outer cover contour -->
  <path d="M 80 380 Q 256 320 256 410 Q 256 320 432 380 L 416 260 Q 256 220 256 290 Q 256 220 96 260 Z" fill="#047857" opacity="0.15"/>
  <path d="M 80 380 Q 256 335 256 415 Q 256 335 432 380" stroke="#047857" stroke-width="20" stroke-linecap="round" fill="none"/>
  <path d="M 96 270 Q 256 220 256 390 Q 256 220 416 270" stroke="#047857" stroke-width="18" stroke-linecap="round" fill="none"/>
  <!-- Book page lines -->
  <path d="M 96 270 L 80 380" stroke="#047857" stroke-width="18" stroke-linecap="round"/>
  <path d="M 416 270 L 432 380" stroke="#047857" stroke-width="18" stroke-linecap="round"/>
